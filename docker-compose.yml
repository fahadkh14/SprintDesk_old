name: sprintdesk

services:
  mysql:
    image: mysql:8.4
    container_name: sprintdesk-mysql
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sprintdesk}
      MYSQL_USER: ${MYSQL_USER:-sprintdesk}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
      - sprintdesk_mysql_data:/var/lib/mysql
      # Scripts run once, the first time the volume is empty (schema, then seed data)
      - ./database/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "3306"            # reachable only inside the Docker network, not published to the host
    networks:
      - sprintdesk-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  backend:
    build:
      context: ./backend
    image: sprintdesk-backend:latest
    container_name: sprintdesk-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5761
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${MYSQL_DATABASE:-sprintdesk}
      DB_USER: ${MYSQL_USER:-sprintdesk}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-5761}:5761"
    networks:
      - sprintdesk-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5761/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    image: sprintdesk-frontend:latest
    container_name: sprintdesk-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-8092}:80"
    networks:
      - sprintdesk-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  sprintdesk-net:
    name: sprintdesk-net
    driver: bridge

volumes:
  sprintdesk_mysql_data:
    name: sprintdesk_mysql_data
